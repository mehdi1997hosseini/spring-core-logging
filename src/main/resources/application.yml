spring:
  application:
    name: spring-boot-efk

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${SPRING_DATASOURCE_USERNAME:mh}
    password: ${SPRING_DATASOURCE_PASSWORD:mh}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

#logging:
#  level:
#    root: INFO
#    com.example.efk: DEBUG
#  pattern:
#    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","logger":"%c","thread":"%t","message":"%m","exception":"%ex"}%n'

logging:
  structured:
    format:
      console: ecs

efk:
  enabled: true

  elasticsearch:
    host: localhost
    port: 9200
    connection-timeout: 3000
    socket-timeout: 30000
