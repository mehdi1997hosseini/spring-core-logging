[SERVICE]
    Flush                     1
    Daemon                    Off
    Log_Level                 info
    Parsers_File              /fluent-bit/etc/parsers.conf

[INPUT]
    Name                      tail
    Path                      /var/lib/docker/containers/*/*.log
    Parser                    docker
    Tag                       docker.*
    Refresh_Interval           5
    Mem_Buf_Limit             50MB
    Skip_Long_Lines            On
    DB                        /tmp/flb-docker.db

[FILTER]
    Name                      modify
    Match                     docker.*
    Add                       service spring-boot-efk

[FILTER]
    Name                      parser
    Match                     docker.*
    Key_Name                  log
    Parser                    spring_json
    Reserve_Data              On
    Preserve_Key              Off

[OUTPUT]
    Name                      es
    Match                     docker.*
    Host                      elasticsearch
    Port                      9200
    Index                     spring-boot-efk
    Suppress_Type_Name        On
    Logstash_Format            On
    Retry_Limit                False
